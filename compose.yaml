name: folio-forms

services:
  postgres:
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data-v18:/var/lib/postgresql

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID:?set RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY:?set RUSTFS_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:9000/health/ready",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: rustfs/rc:v0.1.35
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID:?set RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY:?set RUSTFS_SECRET_ACCESS_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?set RUSTFS_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY" && rc bucket create "local/$$RUSTFS_BUCKET" --ignore-existing && rc anonymous set private "local/$$RUSTFS_BUCKET"

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    expose:
      - "80"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://localhost/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-cache:/var/lib/onlyoffice

  document-worker-daemon:
    image: docker:29-dind
    privileged: true
    cgroup: host
    restart: unless-stopped
    entrypoint: ["dockerd", "-H", "unix:///var/run/worker/docker.sock"]
    networks: [document-worker-daemon]
    volumes:
      - document-worker-socket:/var/run/worker
      - document-worker-workspaces:/workspaces
      - document-worker-docker:/var/lib/docker

  document-worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.document-worker
    restart: unless-stopped
    depends_on: [document-worker-daemon]
    environment:
      DOCKER_HOST: unix:///var/run/worker/docker.sock
      WORKER_IMAGE_CONTEXT: /app/worker-image
    networks: [document-worker-api, document-worker-daemon]
    volumes:
      - document-worker-socket:/var/run/worker
      - document-worker-workspaces:/workspaces

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    platform: linux/amd64
    image: hadesgod/folio-server
    networks: [default, document-worker-api]
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      EDITOR_CAPABILITY_SECRET: ${EDITOR_CAPABILITY_SECRET:?set EDITOR_CAPABILITY_SECRET}
      PREFILL_HANDOFF_SECRET: ${PREFILL_HANDOFF_SECRET:?set PREFILL_HANDOFF_SECRET}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      SERVER_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      API_BASE: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      ONLYOFFICE_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}/office
      ONLYOFFICE_API_BASE: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}/office
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_DOCUMENT_BASE_URL: http://server:3000
      PREFILL_RETURN_URL: ${PREFILL_RETURN_URL:?set PREFILL_RETURN_URL}
      LEGACY_SSO_AUTHORIZE_URL: ${LEGACY_SSO_AUTHORIZE_URL:-}
      LEGACY_SSO_CALLBACK_URL: ${LEGACY_SSO_CALLBACK_URL:-}
      LEGACY_SSO_CLIENT_ID: ${LEGACY_SSO_CLIENT_ID:-}
      LEGACY_SSO_CLIENT_SECRET: ${LEGACY_SSO_CLIENT_SECRET:-}
      LEGACY_SSO_EXCHANGE_URL: ${LEGACY_SSO_EXCHANGE_URL:-}
      LEGACY_SSO_PROVIDER_ID: ${LEGACY_SSO_PROVIDER_ID:-}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:?set RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:?set RUSTFS_SECRET_ACCESS_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?set RUSTFS_BUCKET}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      DOCUMENT_WORKER_URL: http://document-worker:3010
      TEMPLATE_PATH: /app/onlyoffice-templates/template.docx
    command:
      [
        "sh",
        "-c",
        "cd /app && bun run --cwd packages/db db:migrate && cd /app/apps/server && bun dist/index.mjs",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
    image: hadesgod/folio-web
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

  web-assets:
    image: hadesgod/folio-web
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SERVER_CONFIG_FILE: /etc/sws-assets.toml
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    image: vicanso/pingap:0.14.2
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
      web-assets:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    expose:
      - "80"
    volumes:
      - ./gateway/pingap.toml:/opt/pingap/pingap.toml:ro
    command: ["-c", "/opt/pingap/pingap.toml", "--autoreload"]

  prefill-mock:
    image: oven/bun:1.4.0@sha256:5ff609364c049b54eb0ff560ec96319729a972078ef2c755d758f0c6ef89c2d6
    profiles: [verification]
    depends_on:
      server:
        condition: service_healthy
    working_dir: /workspace
    command: ["bun", "run", "apps/prefill-mock/src/index.ts"]
    environment:
      PREFILL_HANDOFF_SECRET: ${PREFILL_HANDOFF_SECRET:?set PREFILL_HANDOFF_SECRET}
      FOLIO_ORIGIN: ${FOLIO_ORIGIN:?set FOLIO_ORIGIN}
      PREFILL_MOCK_PORT: "3010"
    ports:
      - "3010:3010"
    volumes:
      - .:/workspace:ro

networks:
  document-worker-api:
    internal: true
  document-worker-daemon:

volumes:
  postgres-data-v18:
  onlyoffice-data:
  onlyoffice-logs:
  onlyoffice-cache:
  rustfs-data:

  document-worker-socket:
  document-worker-workspaces:
  document-worker-docker:
